# Packages installed by `run_onchange_before_install-packages.sh.tmpl`.
# Editing this file and running `chezmoi apply` installs what was added; it
# never uninstalls (remove those by hand with `brew uninstall`).
# Tap-qualified names (`owner/tap/name`) tap their repo automatically.
packages:
  darwin:
    brews:
      # Shell
      - atuin
      - bat # `zf` preview in .zshrc
      - carapace
      - eza # fzf-tab previews in .zshrc
      - fd
      - fzf
      - ripgrep # nvim pickers, grep
      - starship
      - zoxide
      - zsh
      # Editor and terminal
      - neovim
      - tree-sitter-cli
      - harper
      - yazi
      - zellij
      - tmux
      - btop
      - chafa
      - tree
      # Git
      - git
      - git-delta
      - git-filter-repo
      - git-lfs
      - gh
      - gitleaks # pre-commit secret scan in this repo
      - lazygit
      - lefthook
      - pre-commit
      - worktrunk
      - gnupg
      # Languages and toolchains
      - mise
      - go
      - node
      - make
      # Infra and CLIs
      - awscli
      - cloudflared
      - hashicorp/tap/terraform
      - actionlint
      - mkcert
      - nss
      - yq
      - graphviz
      - ffmpeg # frame backend: watermark and media utils shell out to it
      - imagemagick
      - tectonic
      - serpl
      - opencode
      - fresh-editor
      - chezmoi
    casks:
      - codex
      - dockdoor
      - font-geist-mono-nerd-font # Rex fallback: box-drawing and icons for Geist Mono
      - ghostty
      - hammerspoon
      - karabiner-elements # Caps Lock as Hyper on the laptop keyboard
      - terraform-linters/tap/tflint
      - visual-studio-code
      - vlc
  # Linux (WSL): extra formulae on top of the darwin brews, which
  # install-packages.sh.tmpl also installs there (casks are macOS-only).
  linux:
    brews:
      - fnm # macOS has it outside this list; .zshrc needs it
  # Windows: scoop ("bucket/name" for non-main buckets). Installed by
  # `run_onchange_before_install-packages.ps1.tmpl`. zsh, tmux, zellij,
  # ghostty, karabiner etc. have no Windows build; WSL covers those.
  windows:
    buckets:
      - extras
      - nerd-fonts
    scoop:
      # Shell
      - atuin
      - bat
      - carapace-bin
      - eza
      - fd
      - fzf
      - ripgrep
      - starship
      - zoxide
      - less # pager for delta/bat
      # Editor and terminal
      - neovim
      - tree-sitter
      - gcc # treesitter parser builds
      - yazi
      - btop
      - extras/wezterm # Ghostty stand-in
      - extras/autohotkey # Caps Lock = Hyper (Karabiner stand-in)
      - nerd-fonts/GeistMono-NF
      # Git
      - delta
      - gh
      - gitleaks
      - lazygit
      - lefthook
      - gnupg
      # Languages and toolchains
      - mise
      - go
      - make
      # Infra and CLIs
      - aws
      - cloudflared
      - terraform
      - tflint
      - actionlint
      - mkcert
      - jq
      - yq
      - graphviz
      - ffmpeg
      - imagemagick
      - tectonic
      - chezmoi
    # PowerShell 7 modules (zsh plugin stand-ins)
    psmodules:
      - PSFzf # fzf-tab / Ctrl+R / Ctrl+T
